name: auto-catalog

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force a check even before the 3-day window
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: auto-catalog
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe sources
        env:
          FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ '$FORCE' = 'true' ]; then
            node scripts/update-catalog.mjs --force
          else
            node scripts/update-catalog.mjs --min-age-days 3
          fi
      - name: Sign catalogue
        env:
          CATALOG_SIGNING_KEY: ${{ secrets.CATALOG_SIGNING_KEY }}
        run: |
          if [ -z "$CATALOG_SIGNING_KEY" ]; then
            echo "::error::Set repository secret CATALOG_SIGNING_KEY before running this workflow"
            exit 1
          fi
          node scripts/sign-catalog.mjs --key-env CATALOG_SIGNING_KEY --in catalog.json
      - name: Verify catalogue
        run: node scripts/verify-catalog.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- catalog.json; then
            echo "No catalogue change"
            exit 0
          fi
          git config user.name "cyber-egg-catalog-bot"
          git config user.email "cyber-egg-catalog-bot@users.noreply.github.com"
          git add catalog.json
          git commit -m "catalog: automatic probe $(date -u +%Y-%m-%d)"
          git push
