name: check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and manifest checks
        run: |
          node --check index.js
          node --check client.js
          node --check catalog.js
          node -e "for (const f of ['package.json','update.json','catalog.json','locale/zh.json','locale/en.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          node -e "const p=require('./package.json'); if (!p.dsh?.bundle?.patch || !p.dsh?.client) throw new Error('missing dsh manifest fields')"
      - name: Version constant matches package.json
        run: |
          node -e "
            const fs=require('fs');
            const p=require('./package.json');
            const src=fs.readFileSync('index.js','utf8');
            const m=src.match(/const PLUGIN_VERSION = '([^']+)'/);
            if (!m) throw new Error('PLUGIN_VERSION not found in index.js');
            if (m[1]!==p.version) throw new Error('PLUGIN_VERSION '+m[1]+' != package.json '+p.version);
            if (p.version!==JSON.parse(fs.readFileSync('update.json','utf8')).version) throw new Error('update.json version mismatch');
            console.log('version ok', p.version);
          "
      - name: Manifest signature
        run: node scripts/verify-manifest.mjs
      - name: Official catalogue signature
        run: node scripts/verify-catalog.mjs
      - name: Tarball matches update.json
        run: |
          node -e "
            const fs=require('fs'), crypto=require('crypto');
            const u=JSON.parse(fs.readFileSync('update.json','utf8'));
            const file='cyber-egg-'+u.version+'.tgz';
            if (!fs.existsSync(file)) throw new Error('missing '+file);
            const sha=crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex');
            if (sha.toUpperCase()!==u.sha256.toUpperCase()) throw new Error('sha256 mismatch: '+sha);
            console.log('tarball ok', file, sha);
          "
